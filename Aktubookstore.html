<!DOCTYPE html>
<html>
<head>
    <title>AKTU Bookstore</title>
    <style>
        body { font-family: Impact, Haettenschweiler, 'Arial Narrow', sans-serif ; margin: 0; background: #f4f4f4; text-align: center; }
        .header { background: #003366; color: white; padding: 15px; }
        .nav { color: white; margin: 0 10px; font-weight: bold; }
        .hero { background: #e6f0fa; padding: 30px; border-bottom: 2px solid #ffcc00; }
        .search { padding: 8px; width: 250px; }
        .Books { display: flex; justify-content: center; gap: 20px; padding: 30px; flex-wrap: wrap; }
        .card { background: white; padding: 15px; border: 1px solid #ddd; width: 180px; border-radius: 5px; }
        .cover { background: #003366; color: white; height: 120px; padding-top: 40px; font-weight: bold; font-size: 14px; }
        .price { color: red; font-weight: bold; margin: 10px 0; }
        .btn { background: #ffcc00; color: #003366; padding: 6px 12px; font-weight: Italic; display: inline-block; }
    </style>
</head>
<body>

    <div class="header">
        <h2>AKTU Bookstore</h2>
        <div class="nav">
            <a href="#">Home</a> | <a href="#">B.Tech</a> | <a href="#">CSIT</a> | <a href="#">CSE</a>
        </div>
    </div>

    <div class="hero">
        <h3>Find Your Syllabus Books</h3>
        <button>Search for Books </button>
    </div>

    <div class="Books">

        <div class="card">
            <div class="cover">Book 1<br>Subject code</div>
            <p><b>Author 1</b></p>
            <div class="price">₹100</div>
            <a href="#" class="btn">Buy Now</a>
        </div>

        <div class="card">
            <div class="cover">Book 2<br>Subject code</div>
            <p><b>Author 2</b></p>
            <div class="price">₹100</div>
            <a href="#" class="btn">Buy Now</a>
        </div>

        <div class="card">
            <div class="cover">Book 3<br>Subject code</div>
            <p><b>Author 3</b></p> 
            <div class="price">₹100</div>
            <a href="#" class="btn">Buy Now</a>
        </div>

    </div>
